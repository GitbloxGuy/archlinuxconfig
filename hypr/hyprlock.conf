
# Core Session Lock Security Behavior
general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 0
}

# Solid Gruvbox Dark Background
background {
    monitor =
path = ~/Wallpapercycle/giorino1yellow.jpg # Instantly grabs a snapshot of your live screen
    

}

# Centered Digital Clock
label {
    monitor =
    text = cmd[update:500] echo "$(date +"%I:%M:%S %P")"
    color = rgb(235, 219, 178) # Gruvbox Light (fg0)
    font_size = 64
    font_family = JetBrains Mono
    position = 40, -40
    halign = left
    valign = top
}

# Subtitle Date Display
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d")"
    color = rgb(168, 153, 132) # Gruvbox Dark Gray (fg4)
    font_size = 16
    font_family = JetBrains Mono
    halign = left
    valign = top    
    position = 49, -150
}

# Minimalist Centered Password Input Circle
input-field {
    monitor =
    size = 100, 50
    outline_thickness = 1
    rounding = 1
    dots_size = 0.10
    dots_spacing = 0.3
    dots_fade_time = 100
    fade_on_empty = true # Fades out completely when empty for total minimalism
    fade_timeout = 1000
    
    # Colors matching the Gruvbox scheme
    font_color = rgb(235, 219, 178)
    inner_color = rgba(0, 0, 0, 0) # Gruvbox Dark (bg1)
    outer_color = rgba(0, 0, 0, 0) # Accent ring (Gruvbox Aqua)
    check_color = rgba(0, 0, 0, 0) # Accent validation yellow
    fail_color = rgb(204, 36, 29) # Fail validation red
    fail_transition = 0

    placeholder_text = <span font_family="JetBrains Mono"> </span>
    fail_text = <span font_family="JetBrains Mono"> </span>
    hide_input = false
    
    position = 0, -60
    halign = center
    valign = center
}
